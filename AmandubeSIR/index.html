<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Service Suspended | Quickly Grow</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --accent: #ff3b30;
      --accent-glow: rgba(255, 59, 48, 0.15);
      --glass: rgba(255, 255, 255, 0.88);
      --border: rgba(0, 0, 0, 0.06);
      --text: #0f0f14;
      --subtext: #666672;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f7f8fc;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .nebula-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(circle at 15% 25%, rgba(255, 59, 48, 0.08) 0%, transparent 45%),
                  radial-gradient(circle at 85% 75%, rgba(112, 0, 255, 0.1) 0%, transparent 45%);
      animation: nebula-drift 22s ease-in-out infinite alternate;
    }

    @keyframes nebula-drift {
      0% { transform: translate(-4%, -3%) rotate(0deg); }
      100% { transform: translate(4%, 3%) rotate(4deg); }
    }

    .top-nav {
      position: fixed;
      top: 0;
      width: 100%;
      height: 68px;
      z-index: 1000;
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      max-width: 480px;
      left: 50%;
      transform: translateX(-50%);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.3px;
    }

    .nav-logo {
      height: 38px;
      width: 38px;
      border-radius: 14px;
      object-fit: cover;
      background: #eee;
      box-shadow: 0 6px 14px rgba(0,0,0,0.04);
    }

    .container {
      width: 100%;
      max-width: 440px;
      margin-top: 50px;
    }

    .card-frame {
      position: relative;
      border-radius: 34px;
      padding: 2px;
      background: linear-gradient(130deg, #ff4d4d, #7000ff, #ff4d4d);
      background-size: 200% 200%;
      animation: border-flow 5s linear infinite;
      box-shadow: 0 28px 48px rgba(0,0,0,0.06);
    }

    @keyframes border-flow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card-inner {
      background: #fff;
      border-radius: 31px;
      padding: 36px 24px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      letter-spacing: 2px;
      color: #ff3b30;
      background: #ffebeb;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .status-badge i {
      font-size: 0.8rem;
    }

    .main-heading {
      font-size: 1.7rem;
      font-weight: 800;
      line-height: 1.25;
      color: #121214;
      letter-spacing: -0.5px;
    }

    .notice-box {
      background: #fbfbfd;
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 20px;
      padding: 16px 18px;
      font-size: 0.88rem;
      color: var(--subtext);
      line-height: 1.6;
    }

    .notice-box strong {
      color: #121214;
    }

    .btn-animate {
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1);
      will-change: transform, opacity;
    }

    .btn-animate:active {
      transform: scale(0.95);
      opacity: 0.88;
    }

    .tg-reactivate-btn {
      width: 100%;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #0a0a0a;
      color: #fff;
      padding: 18px;
      border-radius: 20px;
      font-weight: 650;
      letter-spacing: 0.5px;
      font-size: 0.95rem;
      position: relative;
      overflow: hidden;
      margin-top: 8px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.15);
    }

    .tg-reactivate-btn i {
      font-size: 1.15rem;
      color: #29b6f6;
    }

    .tg-reactivate-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
      transform: skewX(-25deg);
      animation: shine 3.5s infinite;
    }

    @keyframes shine {
      0% { left: -100%; }
      100% { left: 200%; }
    }

    .footer-note {
      font-size: 0.75rem;
      color: #9c9ca4;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="nebula-bg"></div>

  <!-- Top Bar -->
  <nav class="top-nav">
    <div class="nav-brand">
      <img src="https://d1yei2z3i6k35z.cloudfront.net/13184094/6a69c119dfd6c4.93432994_20260624_124814.jpg" class="nav-logo" alt="Logo">
      <span>QUICKLY</span>
    </div>
  </nav>

  <div class="container">
    <div class="card-frame">
      <div class="card-inner">
        <div class="status-badge">
          <i class="fas fa-exclamation-circle"></i> Service Suspended
        </div>

        <h1 class="main-heading">This Landing Page Is Currently Inactive</h1>

        <div class="notice-box">
          Access has been temporarily restricted due to an <strong>unpaid invoice / pending dues</strong>. Please settle the outstanding balance to restore live services.
        </div>

        <a id="reactivateLink" href="#" target="_blank" class="tg-reactivate-btn btn-animate">
          <i class="fab fa-telegram-plane"></i> Request To Turn On Page
        </a>

        <div class="footer-note">
          Instant reactivation upon payment verification.
        </div>
      </div>
    </div>
  </div>

  <script>
    // Current page URL fetch karke Telegram link me encode karega
    const currentUrl = window.location.href;
    const message = encodeURIComponent(`${currentUrl}\nThis landing page is not working due to pending payment. Please reactivate it.`);
    document.getElementById('reactivateLink').href = `https://t.me/quicklygrow?text=${message}`;
  </script>

</body>
</html>
